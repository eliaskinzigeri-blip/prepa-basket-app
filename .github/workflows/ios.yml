# Fabrique l'IPA de Prépa Basket sur un Mac de GitHub, sans signature : SideStore la signe avec ton identifiant Apple.
# Lancement : à chaque push sur main, ou à la main (onglet Actions → « IPA iPhone » → Run workflow).
name: IPA iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

# Écriture des versions GitHub (IPA) et de la branche « sidestore » (source.json)
permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_BUILD: ${{ github.run_number }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Compilation de l'app web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PRONOTE_ACCOUNT: ${{ secrets.VITE_PRONOTE_ACCOUNT }}
        run: npx vite build

      - name: Projet iOS (Capacitor)
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Module natif PrepaVision (sauts en 3D, trajectoires du ballon)
        run: |
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj --no-document
          # Détection du ballon (jeux de dribble) : modèle YOLOv3 publié par Apple
          curl -fsSL -o native-ios/YOLOv3Int8LUT.mlmodel https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3/YOLOv3Int8LUT.mlmodel
          ruby native-ios/add-native.rb

      - name: Autorisations iOS (Bluetooth, caméra, Face ID, notifications)
        run: |
          PLIST=ios/App/App/Info.plist
          # plutil accepte tous les caractères (PlistBuddy coupe les textes à l'apostrophe)
          set_key() { plutil -replace "$1" -string "$2" "$PLIST"; }
          set_key NSBluetoothAlwaysUsageDescription "Prépa Basket se connecte à ta ceinture cardio, à ton rameur et à ta balance."
          set_key NSBluetoothPeripheralUsageDescription "Prépa Basket se connecte à ta ceinture cardio, à ton rameur et à ta balance."
          set_key NSCameraUsageDescription "La caméra analyse tes tirs, ton dribble et tes sauts (suivi du corps en 3D). Aucune vidéo n'est envoyée sur un serveur."
          set_key NSMicrophoneUsageDescription "Le micro n'est pas utilisé ; iOS le demande avec la caméra pour certaines vidéos."
          set_key NSFaceIDUsageDescription "Face ID verrouille Prépa Basket pour que toi seul y accèdes."
          set_key NSPhotoLibraryUsageDescription "Pour importer la photo d'un repas depuis ta galerie."
          set_key NSPhotoLibraryAddUsageDescription "Pour enregistrer les replays de tes tirs."
          # Numéro de version 1.0.N : chaque compilation apparaît comme une mise à jour dans SideStore
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$APP_BUILD" "$PLIST"
          # Vérification : la compilation échoue si une autorisation manque (sans elle, iOS ferme l'app)
          for k in NSBluetoothAlwaysUsageDescription NSCameraUsageDescription NSMicrophoneUsageDescription NSFaceIDUsageDescription NSPhotoLibraryUsageDescription; do
            plutil -extract "$k" raw "$PLIST" > /dev/null || { echo "Autorisation manquante : $k"; exit 1; }
          done

      - name: Compilation Xcode (sans signature)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40

      - name: Paquet IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry PrepaBasket.ipa Payload
          ls -lh PrepaBasket.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PrepaBasket-ipa
          path: PrepaBasket.ipa
          retention-days: 30

      - name: Version GitHub v1.0.N (adresse de téléchargement fixe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" PrepaBasket.ipa --title "Prépa Basket $APP_VERSION" \
            --notes "IPA sans signature, à installer avec SideStore (source : https://raw.githubusercontent.com/${{ github.repository }}/sidestore/source.json)." --latest

      - name: Source SideStore (branche sidestore)
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v$APP_VERSION/PrepaBasket.ipa"
          python3 .github/sidestore_source.py PrepaBasket.ipa "$APP_VERSION" "$APP_BUILD" "$URL" /tmp/source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin sidestore 2>/dev/null; then git checkout -q -B sidestore origin/sidestore; else git checkout -q --orphan sidestore; git rm -rfq --cached .; fi
          cp /tmp/source.json source.json
          git add source.json
          git commit -qm "Source SideStore : $APP_VERSION" && git push -q origin sidestore
